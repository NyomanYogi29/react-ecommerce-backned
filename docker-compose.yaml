services:
    db:
        image: mariadb
        ports:
            - "3306:3306"
        environment:
            MARIADB_DATABASE: ${DB_DATABASE}
            MARIADB_USERNAME: ${DB_USERNAME}
            MARIADB_ROOT_PASSWORD: ${DB_PASSWORD}
        volumes:
            - mariadb_data:/var/lib/mysql

volumes:
    mariadb_data:
